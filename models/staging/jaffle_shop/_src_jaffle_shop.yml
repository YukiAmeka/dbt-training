sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres database
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: PK for customers data
            data_tests:
              - unique
              - not_null
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: PK for orders data
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 60
              period: day
